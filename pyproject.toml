[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confident-pooled-peaks"
version = "0.1.0"
description = "Within-lab MSPC and shift-calibrated cross-lab pooling for broad histone peaks"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pysam>=0.22,<1",
    "pyBigWig>=0.3.22,<1",
]

[project.scripts]
confident-pooled-peaks = "pooled_peaks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
