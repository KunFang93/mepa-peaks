[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mepa-peaks"
version = "0.2.0"
description = "MEPA (Multi-Experiment Peak Aggregation) for shift-calibrated pooling of broad peaks across labs"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pysam>=0.22,<1",
    "pyBigWig>=0.3.22,<1",
]

[project.scripts]
mepa-peaks = "pooled_peaks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
